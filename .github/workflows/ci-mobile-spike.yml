# EXPERIMENTAL and UNVERIFIED. These jobs have never been run: macOS, Xcode and the
# Android NDK were not available where this was written. Expect to fix them.
name: ci-mobile-spike
on:
  workflow_dispatch:
  pull_request:
    paths: ["core/crates/proxim-ffi/**", ".github/workflows/ci-mobile-spike.yml"]
permissions:
  contents: read
jobs:
  ios-xcframework:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: build static libs
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --manifest-path core/Cargo.toml -p proxim-ffi --release --target $t
          done
      - name: UniFFI Swift bindings + XCFramework (UNVERIFIED)
        run: |
          cargo run --manifest-path core/Cargo.toml -p proxim-ffi --bin uniffi-bindgen -- \
            generate --library core/target/aarch64-apple-ios/release/libproxim_ffi.a \
            --language swift --out-dir core/target/swift
          xcodebuild -create-xcframework \
            -library core/target/aarch64-apple-ios/release/libproxim_ffi.a \
            -library core/target/aarch64-apple-ios-sim/release/libproxim_ffi.a \
            -output core/target/ProximCore.xcframework

  android-aar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: build .so (UNVERIFIED)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o core/target/jniLibs \
            build --manifest-path core/Cargo.toml -p proxim-ffi --release
      - name: package AAR (placeholder)
        run: echo "AAR packaging via Gradle is not written yet (sdks/android)."
