# Runs the whole engine test suite compiled to WebAssembly (wasm32-wasip1 on
# Wasmtime), and checks the browser target (wasm32-unknown-unknown) builds.
name: ci-wasm
on:
  push:
    branches: [main]
  pull_request:
    paths: ["core/**", "sdks/web/**", "rust-toolchain.toml", ".github/workflows/ci-wasm.yml"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: wasmtime --version
      - name: build for the browser (wasm32-unknown-unknown)
        run: cargo build --manifest-path core/Cargo.toml -p proxim-wasm --target wasm32-unknown-unknown --release
      - name: full test suite on WebAssembly (wasm32-wasip1 on Wasmtime)
        env:
          # Preopen / so the tests can read core/testdata at its host path.
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=/::/ -S inherit-env
        run: cargo test --manifest-path core/Cargo.toml --workspace --target wasm32-wasip1 --no-fail-fast
